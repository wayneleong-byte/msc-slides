<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>生態網｜熱帶稀樹草原</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <h1>生態網｜熱帶稀樹草原</h1>
        <p class="disclaimer-inline" id="disclaimerBanner">教學簡化：物種與連線為課堂可見模型，唔等於真實完整生態。</p>
      </div>
      <div class="top-actions">
        <button type="button" id="btnGlossary" class="btn ghost">名詞表</button>
        <button type="button" id="btnQuiz" class="btn primary">通識自評</button>
      </div>
    </header>

    <div id="loadError" class="load-error" hidden></div>

    <main class="layout" id="mainLayout" hidden>
      <section class="canvas-panel">
        <div class="canvas-toolbar">
          <div class="abiotic" id="abioticTags" aria-label="非生物因子"></div>
          <div class="filters" id="relationFilters" aria-label="關係篩選"></div>
        </div>
        <div class="canvas-wrap" id="canvasWrap">
          <svg id="webSvg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="食物網">
            <defs>
              <marker id="arrowPredation" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#b03828"></path>
              </marker>
              <marker id="arrowHerbivory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#3d7a28"></path>
              </marker>
              <marker id="arrowDetritivory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#7a5530"></path>
              </marker>
              <marker id="arrowMutualism" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e7a58"></path>
              </marker>
              <marker id="arrowParasitism" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#8a4060"></path>
              </marker>
              <marker id="arrowCommensalism" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a7040"></path>
              </marker>
            </defs>
            <g id="edgesLayer"></g>
            <g id="nodesLayer"></g>
          </svg>
          <div id="idleOverlay" class="idle-overlay" hidden>
            <div class="idle-frost">
              <p>點一下繼續</p>
            </div>
          </div>
        </div>
        <aside class="legend" id="legend">
          <h2>圖例</h2>
          <p class="legend-note">取食／碎屑：箭頭指向獲能方（消費者）。競爭：雙向虛線、無能量箭頭。</p>
          <div class="legend-block" id="legendRelations"></div>
          <div class="legend-block" id="legendTrophic"></div>
        </aside>
      </section>

      <aside class="side-panel">
        <section class="card" id="detailCard">
          <h2>詳情</h2>
          <div id="detailBody" class="detail-body">
            <p class="muted">點選畫布上的物種或連線。</p>
          </div>
        </section>

        <section class="card lab-card">
          <div class="lab-head">
            <h2>實驗室｜自選物種</h2>
            <div class="lab-actions">
              <button type="button" id="btnSelectAll" class="btn tiny">全選</button>
              <button type="button" id="btnClearLab" class="btn tiny">清空</button>
              <button type="button" id="btnResetLab" class="btn tiny">重設</button>
            </div>
          </div>
          <p id="labWarn" class="lab-warn" hidden>警告：目前少於 2 個生產者，子網能量入口偏弱（仍可探索）。</p>
          <div id="labList" class="lab-list"></div>
        </section>
      </aside>
    </main>
  </div>

  <!-- 名詞表 -->
  <div id="glossaryModal" class="modal" hidden>
    <div class="modal-panel glossary-panel">
      <header class="modal-head">
        <h2>名詞表</h2>
        <button type="button" class="btn ghost" id="btnCloseGlossary" aria-label="關閉">關閉</button>
      </header>
      <input type="search" id="glossarySearch" class="search" placeholder="搜尋名詞…" autocomplete="off" />
      <p class="muted tiny" id="glossaryDisclaimer"></p>
      <div id="glossaryList" class="glossary-list"></div>
    </div>
  </div>

  <!-- Quiz -->
  <div id="quizModal" class="modal" hidden>
    <div class="modal-panel quiz-panel">
      <header class="modal-head">
        <h2>通識自評</h2>
        <button type="button" class="btn ghost" id="btnCloseQuiz" aria-label="關閉">關閉</button>
      </header>
      <div id="quizBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
