<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>專項物價｜澳門物價站</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <div>
        <h1>專項物價</h1>
        <p>分類清單＋官方報告連結（鏡像）</p>
      </div>
    </div>
  </header>
  <nav class="nav-bar" aria-label="主選單">
    <a href="index.html">主頁</a>
    <a href="supermarket.html">超市</a>
    <a href="cart.html">清單 <span class="chip" data-cart-count hidden>0</span></a>
    <a href="market.html">街市</a>
  </nav>
  <main class="wrap">
    <p class="meta-line" id="special-meta">載入中…</p>
    <div class="card">
      <h2>分類</h2>
      <div class="tiles" id="cat-tiles"></div>
      <p class="empty" id="cat-empty" hidden>暫無專項分類。請喺 LAPTOP-7JUE4FNQ 跑 <code>python scripts/fetch_mirror.py --special</code>。</p>
    </div>
    <div class="card" id="detail-card" hidden>
      <h2 id="detail-title">明細</h2>
      <p class="meta-line" id="detail-meta"></p>
      <div id="detail-body"></div>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="app.js"></script>
  <script>
    const CAT_IMG = 'https://consumer-api03.dsedt.gov.mo/app/special/images/cat/';
    let categories = [];

    function pickCatName(c) {
      if (!c) return '';
      const n = c.name;
      if (n && typeof n === 'object') {
        return n.name_cn || n.name || n.name_zh || n.name_en || '';
      }
      if (typeof n === 'string' && n && n !== '[object Object]') return n;
      if (c.name_cn) return c.name_cn;
      if (c.name_zh) return c.name_zh;
      const cat = c.cateogry || c.category;
      if (cat && typeof cat === 'object') return cat.name_cn || cat.name || '';
      if (typeof cat === 'string') return cat;
      return '';
    }

    function linksFromNameObj(n) {
      const links = [];
      const seen = new Set();
      const REPORT_BASE = 'http://api03.consumer.gov.mo/export/sp/report/';
      function add(url, type, name) {
        if (!url || typeof url !== 'string') return;
        url = url.trim();
        if (!url || seen.has(url)) return;
        seen.add(url);
        links.push({ type: type || 'link', url: url, name: name || type || '連結' });
      }
      if (!n || typeof n !== 'object') return links;
      add(n.link, 'link', '中文報告／頁面');
      add(n.link_en, 'link_en', 'English report');
      add(n.link_pt, 'link_pt', 'Relatório PT');
      [['report', '中文 PDF'], ['report_en', 'English PDF'], ['report_pt', 'PDF PT']].forEach(([k, label]) => {
        const r = n[k];
        if (!r || typeof r !== 'string' || !r.trim()) return;
        const u = /^https?:\/\//i.test(r) ? r : REPORT_BASE + r.replace(/^\//, '');
        add(u, k, label);
      });
      return links;
    }

    function normalizeCats(payload) {
      if (!payload) return [];
      const rows = Array.isArray(payload.categories) ? payload.categories
        : (Array.isArray(payload.data) ? payload.data : []);
      return rows.map((c) => {
        const coid = c.coid != null ? c.coid : (c.id != null ? c.id : c.oid);
        const nameObj = (c.name && typeof c.name === 'object') ? c.name
          : ((c.cateogry && typeof c.cateogry === 'object') ? c.cateogry
            : ((c.category && typeof c.category === 'object') ? c.category
              : (c.nameObj || null)));
        const name = pickCatName(c) || String(coid != null ? coid : '');
        const imageUrl = c.imageUrl || c.image || (CAT_IMG + coid + '.png');
        const links = [].concat(c.links || [], linksFromNameObj(nameObj));
        return {
          coid: coid,
          name: name,
          name_cn: c.name_cn || name,
          date: c.date || '',
          imageUrl: imageUrl,
          spe_type: c.spe_type || (nameObj && nameObj.spe_type) || null,
          links: links,
          nameObj: nameObj,
        };
      });
    }


    function renderCats() {
      const box = document.getElementById('cat-tiles');
      const empty = document.getElementById('cat-empty');
      box.innerHTML = '';
      empty.hidden = categories.length > 0;
      categories.forEach((cat) => {
        const a = document.createElement('button');
        a.type = 'button';
        a.className = 'tile special-cat-tile';
        a.innerHTML =
          '<img src="' + MPS.escapeHtml(cat.imageUrl) + '" alt="" onerror="this.style.display=\'none\'" />' +
          '<h2>' + MPS.escapeHtml(cat.name) + '</h2>' +
          '<div class="sub">' + MPS.wrapUpdateHtml('資料日', cat.date || '') + '</div>';
        a.addEventListener('click', () => openDetail(cat));
        box.appendChild(a);
      });
    }

    function mergeLinks() {
      const seen = new Set();
      const out = [];
      for (let i = 0; i < arguments.length; i++) {
        const arr = arguments[i] || [];
        arr.forEach((lk) => {
          if (!lk || !lk.url) return;
          if (seen.has(lk.url)) return;
          seen.add(lk.url);
          out.push(lk);
        });
      }
      return out;
    }

    function renderPriceTable(d) {
      const items = d.items || [];
      const prices = d.prices || [];
      let html = '';
      if (items.length) {
        html += '<h3 style="margin:12px 0 8px;font-size:1rem;">品項一覽（最低／最高）</h3>';
        html += '<div style="overflow:auto"><table class="store-table"><thead><tr>' +
          '<th>品名</th><th>規格</th><th>最低</th><th>最高</th><th>報價數</th></tr></thead><tbody>';
        items.forEach((it) => {
          html += '<tr><td>' + MPS.escapeHtml(it.name_cn || '') + '</td>' +
            '<td>' + MPS.escapeHtml(it.quantity_cn || '') + '</td>' +
            '<td>' + MPS.escapeHtml(it.minPrice || '—') + '</td>' +
            '<td>' + MPS.escapeHtml(it.maxPrice || '—') + '</td>' +
            '<td>' + MPS.escapeHtml(String(it.priceCount != null ? it.priceCount : '')) + '</td></tr>';
        });
        html += '</tbody></table></div>';
      }
      if (prices.length) {
        html += '<h3 style="margin:16px 0 8px;font-size:1rem;">分店價目（' + prices.length + ' 筆）</h3>';
        html += '<p class="meta-line">來源：官方 nss <code>price_by_item</code> 鏡像；點欄位可瀏覽全部。</p>';
        html += '<div style="overflow:auto;max-height:480px"><table class="store-table" id="special-price-table"><thead><tr>' +
          '<th>品名</th><th>價格</th><th>店舖</th><th>堂區／區</th><th>地址</th></tr></thead><tbody>';
        // show all rows; browser can scroll
        prices.forEach((p) => {
          html += '<tr><td>' + MPS.escapeHtml((p.itemName || '') + (p.quantity ? ' ' + p.quantity : '')) + '</td>' +
            '<td><strong>' + MPS.escapeHtml(p.price || '') + '</strong>' +
            (p.flag ? ' <span class="badge">' + MPS.escapeHtml(p.flag) + '</span>' : '') + '</td>' +
            '<td>' + MPS.escapeHtml(p.storeName || '') + '</td>' +
            '<td>' + MPS.escapeHtml(p.region || '') + '</td>' +
            '<td>' + MPS.escapeHtml(p.address || '') + '</td></tr>';
        });
        html += '</tbody></table></div>';
      }
      if (!items.length && !prices.length) {
        html += '<p class="empty">未有表格式價目。</p>';
      }
      return html;
    }

    function renderLocalPdfs(d) {
      const pdfs = (d.pdfs || []).filter((p) => p && p.localPath);
      if (!pdfs.length) return '';
      let html = '<h3 style="margin:16px 0 8px;font-size:1rem;">本站 PDF</h3>';
      pdfs.forEach((p) => {
        const src = p.localPath;
        html += '<p class="meta-line">' + MPS.escapeHtml(p.name || 'PDF') +
          ' · <a href="' + MPS.escapeHtml(src) + '">下載／開啟</a></p>';
        html += '<iframe class="special-pdf-frame" title="' + MPS.escapeHtml(p.name || 'PDF') +
          '" src="' + MPS.escapeHtml(src) + '#view=FitH" loading="lazy"></iframe>';
      });
      return html;
    }

    function renderFailedPdfs(d) {
      const failed = (d.pdfs || []).filter((p) => p && !p.localPath);
      if (!failed.length) return '';
      let html = '<p class="meta-line">官方 PDF 連結未能下載：</p><ul class="list">';
      failed.forEach((p) => {
        html += '<li><div><div class="title">' + MPS.escapeHtml(p.name || p.type || 'PDF') + '</div>' +
          '<div class="qty">' + MPS.escapeHtml((p.error || ('HTTP ' + (p.httpStatus || '?'))) + ' · ' + (p.url || '')) +
          '</div></div></li>';
      });
      html += '</ul>';
      return html;
    }

    async function openDetail(cat) {
      const card = document.getElementById('detail-card');
      const body = document.getElementById('detail-body');
      const title = document.getElementById('detail-title');
      const metaEl = document.getElementById('detail-meta');
      card.hidden = false;
      title.textContent = cat.name_cn || cat.name;
      body.innerHTML = '<p class="empty">載入明細…</p>';
      metaEl.innerHTML = MPS.wrapUpdateHtml('分類日期', cat.date || '');
      const path = 'data/special/detail/' + encodeURIComponent(String(cat.coid)) + '.json';
      try {
        const d = await MPS.loadJSON(path);
        const detailName = pickCatName(d) || d.name_cn || cat.name;
        title.textContent = detailName;
        const mode = d.mode || '';
        metaEl.innerHTML =
          MPS.wrapUpdateHtml('分類日期', d.date || cat.date || '') +
          (d.sdate ? ' · ' + MPS.wrapUpdateHtml('sdate', d.sdate) : '') +
          (mode ? ' · <span class="badge">' + MPS.escapeHtml(mode) + '</span>' : '') +
          (d.priceCount != null ? ' · ' + d.priceCount + ' 筆價' : '') +
          (d.stub ? ' · <span class="badge muted">stub</span>' : '');

        let html = '';
        if (mode === 'table' || (d.prices && d.prices.length) || (d.items && d.items.length)) {
          html += renderPriceTable(d);
          html += renderLocalPdfs(d);
        } else if (mode === 'pdf' || (d.pdfs || []).some((p) => p && p.localPath)) {
          html += renderLocalPdfs(d);
          html += renderFailedPdfs(d);
        } else {
          // fallback: show notes + failed pdfs + no external jump preference
          const notes = d.notes || [];
          if (notes.length) {
            html += '<p class="empty">' + MPS.escapeHtml(notes.join('；')) + '</p>';
          } else {
            html += '<p class="empty">此分類暫無表格式價目，亦無已下載嘅本站 PDF。</p>';
          }
          html += renderFailedPdfs(d);
          const nameObj = (d.name && typeof d.name === 'object') ? d.name
            : (d.nameObj || cat.nameObj || null);
          const links = mergeLinks(d.links, cat.links, linksFromNameObj(nameObj)).filter((lk) => {
            const u = (lk && lk.url) || '';
            // keep nss as same-tab optional reference without forcing blank
            return u && !/\.pdf($|\?)/i.test(u);
          });
          if (links.length) {
            html += '<p class="meta-line">參考（同源優先；以下為官方 nss／頁面）：</p><ul class="list">';
            links.forEach((lk) => {
              html += '<li><div><div class="title">' + MPS.escapeHtml(lk.name || lk.type || '連結') + '</div>' +
                '<div class="qty">' + MPS.escapeHtml(lk.url || '') + '</div></div>' +
                '<a class="btn secondary" href="' + MPS.escapeHtml(lk.url) + '">開啟</a></li>';
            });
            html += '</ul>';
          }
        }
        body.innerHTML = html;
      } catch (e) {
        const links = mergeLinks(cat.links, linksFromNameObj(cat.nameObj));
        if (links.length) {
          let html = '<ul class="list">';
          links.forEach((lk) => {
            const url = lk.url || '';
            html += '<li><div><div class="title">' + MPS.escapeHtml(lk.name || lk.type || '連結') + '</div></div>' +
              (url ? '<a class="btn secondary" href="' + MPS.escapeHtml(url) + '">開啟</a>' : '') +
              '</li>';
          });
          html += '</ul>';
          body.innerHTML = html;
        } else {
          body.innerHTML = '<p class="empty">未有明細檔 <code>' + MPS.escapeHtml(path) + '</code></p>';
        }
      }
      try { card.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (_) {}
    }

    async function loadCategories() {
      try {
        return await MPS.loadJSON('data/special/categories.json');
      } catch (_) {
        try {
          return await MPS.loadJSON('data/special_categories.json');
        } catch (e2) {
          return null;
        }
      }
    }

    Promise.all([MPS.loadMeta(), loadCategories()]).then(([meta, payload]) => {
      categories = normalizeCats(payload);
      const bits = [];
      if (payload && payload.mirroredAt) bits.push(MPS.wrapUpdateHtml('鏡像', payload.mirroredAt));
      if (payload && payload.stub) bits.push('<span class="badge muted">stub／待 Windows 覆蓋</span>');
      bits.push(categories.length + ' 分類');
      document.getElementById('special-meta').innerHTML = bits.join(' · ');
      renderCats();
      MPS.fillFooter(meta, payload && payload.mirroredAt ? [MPS.wrapUpdateHtml('專項鏡像', payload.mirroredAt)] : []);
    });
  </script>
</body>
</html>
