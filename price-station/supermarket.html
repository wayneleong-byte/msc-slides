<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>超市物價｜澳門物價站</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <div>
        <h1>超市物價一覽通</h1>
        <p>名稱搜尋 → 分店價 → 自選店加入清單</p>
      </div>
    </div>
  </header>
  <nav class="nav-bar">
    <a href="index.html">主頁</a>
    <a href="supermarket.html">超市</a>
    <a href="cart.html">清單 <span class="chip" data-cart-count hidden>0</span></a>
    <a href="market.html">街市</a>
  </nav>
  <main class="wrap">
    <div class="card">
      <h2>搜尋貨品</h2>
      <form class="search-row" id="search-form">
        <input type="search" id="q" placeholder="輸入貨品名稱" value="" autocomplete="off" />
        <button type="submit">搜尋</button>
      </form>
      <p class="meta-line" id="search-meta"></p>
      <ul class="list" id="results"></ul>
    </div>
    <div class="card" id="detail-card" hidden>
      <h2 id="detail-title">分店價</h2>
      <p class="meta-line" id="detail-meta"></p>
      <div class="toolbar">
        <button type="button" id="btn-add">加入清單</button>
        <a class="btn secondary" href="cart.html">去清單</a>
      </div>
      <p class="meta-line" id="pick-hint"></p>
      <div id="detail-body"></div>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="app.js"></script>
  <script>
    let searchIndex = { items: [] };
    let currentItem = null;
    let currentDetail = null;
    let meta = null;
    let activeLookId = null;
    const LOOK_HINT = '請往網頁下方看結果';

    function resetLookButtons() {
      document.querySelectorAll('#results button[data-id]').forEach((btn) => {
        btn.textContent = '睇價';
        btn.classList.remove('hint-below', 'btn-scroll-hint');
      });
    }
    function applyLookHint() {
      resetLookButtons();
      if (activeLookId == null) return;
      document.querySelectorAll('#results button[data-id]').forEach((btn) => {
        if (String(btn.getAttribute('data-id')) === String(activeLookId)) {
          btn.textContent = LOOK_HINT;
          btn.classList.add('hint-below');
        }
      });
    }

    function coverageIsFull() {
      const cov = (meta && meta.coverage) || {};
      return cov.coverageMode === 'full' || searchIndex.coverage === 'full';
    }

    function itemHasPriceMirror(it) {
      if (coverageIsFull()) return true;
      if (it && (it.hasPriceMirror === true || it.mirrored === true)) return true;
      const cov = (meta && meta.coverage) || {};
      const ids = cov.items;
      if (Array.isArray(ids) && ids.map(String).includes(String(it._id))) return true;
      return false;
    }

    function renderResults(list) {
      const ul = document.getElementById('results');
      if (!list.length) {
        ul.innerHTML = '<li class="empty">鏡像索引冇符合結果。可換關鍵字；若索引未齊請喺 ADM-3 跑 <code>scripts/fetch_mirror.py --full</code>。</li>';
        return;
      }
      ul.innerHTML = list.map((it) => {
        const hasMirror = itemHasPriceMirror(it);
        return `<li>
          <div>
            <div class="title">${MPS.escapeHtml(it.name_cn || it.name_zh || '')}</div>
            <div class="qty">${MPS.escapeHtml(it.quantity_cn || '')}${hasMirror ? '<span class="chip">有分店價鏡像</span>' : '<span class="badge muted">未鏡像分店價</span>'}</div>
          </div>
          <button type="button" data-id="${it._id}">睇價</button>
        </li>`;
      }).join('');
      ul.querySelectorAll('button[data-id]').forEach((btn) => {
        btn.addEventListener('click', () => openItem(btn.getAttribute('data-id')));
      });
      applyLookHint();
    }

    function doSearch() {
      const q = (document.getElementById('q').value || '').trim();
      const items = searchIndex.items || [];
      const hit = !q ? items : items.filter((it) => {
        const blob = [it.name_cn, it.name_zh, it.name_en, it.code].join(' ').toLowerCase();
        return blob.includes(q.toLowerCase());
      });
      document.getElementById('search-meta').innerHTML =
        `索引 ${items.length} 品 · 命中 ${hit.length}` +
        (searchIndex.mirroredAt ? ' · ' + MPS.wrapUpdateHtml('索引鏡像', searchIndex.mirroredAt) : '');
      renderResults(hit);
    }

    function storeRadioValue(s) {
      return String(s.storeName || '');
    }

    function selectedStore() {
      const el = document.querySelector('input[name="pick-store"]:checked');
      if (!el || !currentDetail) return null;
      const name = el.value;
      const stores = MPS.flattenStores(currentDetail.groups);
      return stores.find((s) => s.storeName === name && s.price != null) ||
        stores.find((s) => s.storeName === name) || null;
    }

    function updatePickHint() {
      const hint = document.getElementById('pick-hint');
      const pick = selectedStore();
      const best = currentDetail ? MPS.cheapestStore(currentDetail.groups) : null;
      if (!pick || pick.price == null) {
        hint.textContent = '請先選有價嘅分店再加入清單。';
        return;
      }
      const isBest = best && pick.storeName === best.storeName && Number(pick.price) === Number(best.price);
      hint.innerHTML = '將加入：<strong>' + MPS.escapeHtml(pick.storeName) + '</strong> · <span class="price">' +
        MPS.money(pick.price) + '</span>' + (isBest ? ' <span class="chip">即係最低</span>' : ' <span class="badge muted">非最低</span>');
    }

    async function openItem(id) {
      if (activeLookId != null && String(activeLookId) === String(id)) {
        /* 再點同一粒：還原按鈕文案／顏色（detail 仍保留） */
        activeLookId = null;
        applyLookHint();
        return;
      }
      activeLookId = id;
      applyLookHint();
      currentItem = (searchIndex.items || []).find((x) => String(x._id) === String(id)) || { _id: id };
      const card = document.getElementById('detail-card');
      const body = document.getElementById('detail-body');
      card.hidden = false;
      try { card.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (_) {}
      document.getElementById('detail-title').textContent = currentItem.name_cn || ('貨品 #' + id);
      body.innerHTML = '<p class="empty">載入中…</p>';
      document.getElementById('pick-hint').textContent = '';
      try {
        currentDetail = await MPS.loadJSON('data/items/' + id + '.json');
      } catch (e) {
        currentDetail = null;
        document.getElementById('detail-meta').textContent = '';
        body.innerHTML = `<div class="notice">鏡像未有此品（id=${MPS.escapeHtml(id)}）。請喺 ADM-3 跑 <code>scripts/fetch_mirror.py --item ${MPS.escapeHtml(id)}</code> 或 <code>--full</code> 後再部署。</div>`;
        document.getElementById('btn-add').disabled = true;
        return;
      }
      document.getElementById('btn-add').disabled = false;
      const upd = currentDetail.updateDate || '';
      document.getElementById('detail-meta').innerHTML =
        MPS.wrapUpdateHtml('官方資料日期', upd) +
        (currentDetail.mirroredAt ? ' · ' + MPS.wrapUpdateHtml('鏡像', currentDetail.mirroredAt) : '') +
        (currentItem.quantity_cn ? ' · ' + MPS.escapeHtml(currentItem.quantity_cn) : '');
      const best = MPS.cheapestStore(currentDetail.groups);
      const groups = currentDetail.groups || [];
      body.innerHTML = (best ? `<div class="notice info">目前鏡像最低：<strong>${MPS.escapeHtml(best.storeName)}</strong> · <span class="price best">${MPS.money(best.price)}</span>（預設勾選；可改選其他分店）</div>` : '') +
        groups.map((g) => {
          const min = g.min_price;
          const max = g.max_price;
          const rows = (g.supermarkets || []).slice().sort((a, b) => Number(a.price) - Number(b.price));
          return `<details class="group" ${rows.length && Number(rows[0].price) === Number(best && best.price) ? 'open' : ''}>
            <summary>
              <span>${MPS.escapeHtml(g.group_name_cn || g.group_name || '集團')}</span>
              <span class="price">${MPS.money(min)} – ${MPS.money(max)}</span>
            </summary>
            <table class="store-table">
              <thead><tr><th class="col-pick">選</th><th>分店</th><th>售價</th></tr></thead>
              <tbody>
                ${rows.map((s) => {
                  const flat = { storeName: s.supermarket_name, price: s.price == null || s.price === '' ? null : Number(s.price) };
                  const isBest = best && s.supermarket_name === best.storeName && Number(s.price) === Number(best.price);
                  const hasPrice = flat.price != null && !Number.isNaN(flat.price);
                  const val = MPS.escapeHtml(storeRadioValue(flat));
                  return `<tr class="${isBest ? 'best' : ''} pick-row">
                    <td class="col-pick">
                      <label class="pick-label">
                        <input type="radio" name="pick-store" value="${val}"
                          ${!hasPrice ? 'disabled' : ''}
                          ${isBest && hasPrice ? 'checked' : ''} />
                      </label>
                    </td>
                    <td>${MPS.escapeHtml(s.supermarket_name)}${isBest ? ' <span class="chip">最低</span>' : ''}</td>
                    <td class="price">${MPS.money(s.price)}</td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </details>`;
        }).join('');
      body.querySelectorAll('input[name="pick-store"]').forEach((r) => {
        r.addEventListener('change', updatePickHint);
      });
      // Ensure a default if best radio not present (edge)
      if (best && !body.querySelector('input[name="pick-store"]:checked')) {
        const first = body.querySelector('input[name="pick-store"]:not(:disabled)');
        if (first) first.checked = true;
      }
      updatePickHint();
      MPS.fillFooter(meta, [MPS.wrapUpdateHtml('超市資料日期', upd)]);
    }

    document.getElementById('btn-add').addEventListener('click', () => {
      if (!currentDetail) return;
      const item = currentDetail.item || currentItem;
      const best = MPS.cheapestStore(currentDetail.groups);
      const stores = MPS.flattenStores(currentDetail.groups);
      const pick = selectedStore();
      const preferredStore = pick && pick.storeName ? pick.storeName : (best ? best.storeName : null);
      const preferredPrice = pick && pick.price != null ? Number(pick.price)
        : (best ? best.price : null);
      MPS.addToCart({
        id: item._id,
        kind: 'supermarket',
        name: item.name_cn || item.name_zh,
        quantity: item.quantity_cn || '',
        code: item.code || '',
        updateDate: currentDetail.updateDate || '',
        stores,
        bestPrice: best ? best.price : null,
        bestStore: best ? best.storeName : null,
        preferredStore,
        preferredPrice
      });
      alert('已加入清單（' + (preferredStore || '未選店') + ' · ' + MPS.money(preferredPrice) + '）');
    });

    document.getElementById('search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      doSearch();
    });

    Promise.all([MPS.loadJSON('data/search_index.json'), MPS.loadMeta()]).then(([idx, m]) => {
      searchIndex = idx;
      meta = m;
      MPS.fillFooter(meta);
      const q = (document.getElementById('q').value || '').trim();
      if (q) doSearch();
      else {
        document.getElementById('search-meta').textContent =
          `索引 ${(searchIndex.items || []).length} 品 · 請輸入名稱後搜尋` +
          (searchIndex.mirroredAt ? ` · 索引鏡像 ${searchIndex.mirroredAt}` : '');
        document.getElementById('results').innerHTML =
          '<li class="empty">輸入貨品名稱後按搜尋。</li>';
      }
    }).catch((err) => {
      document.getElementById('results').innerHTML = '<li class="empty">無法載入搜尋索引：' + MPS.escapeHtml(err.message) + '</li>';
    });
  </script>
</body>
</html>
