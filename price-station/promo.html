<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>優惠情報站｜澳門物價站</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="site-header">
    <div class="inner"><div><h1>優惠情報站</h1><p>澳門物價站</p></div></div>
  </header>
  <nav class="nav-bar">
    <a href="index.html">主頁</a>
    <a href="supermarket.html">超市</a>
    <a href="cart.html">清單 <span class="chip" data-cart-count hidden>0</span></a>
    <a href="market.html">街市</a>
  </nav>
  <main class="wrap">
    <div class="card">
      <h2>優惠情報站</h2>
      <div class="notice">二期功能。官方有 discount_price／active_goodtype 可機讀；本期只留入口殼，稍後掛鏡像。</div>
      <div id="extra"></div>
      <p style="margin-top:16px"><a href="index.html">← 返回主頁</a></p>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="app.js"></script>
  <script>
    MPS.loadMeta().then(async (meta) => {
      MPS.fillFooter(meta);
      if (location.pathname.endsWith('special.html')) {
        try {
          const d = await MPS.loadJSON('data/special_categories.json');
          const rows = (d.data && d.data.data) ? d.data.data : (d.data || []);
          document.getElementById('extra').innerHTML =
            '<h3 style="margin-top:16px">分類（鏡像）</h3><ul class="list">' +
            rows.map((r) => {
              const name = r.cateogry || r.category || r.name || '';
              const id = r.id || r.coid || '';
              const img = id ? `<img src="https://consumer-api03.dsedt.gov.mo/app/special/images/cat/${id}.png" alt="" style="width:40px;height:40px;object-fit:contain;margin-right:8px;vertical-align:middle" onerror="this.style.display='none'" />` : '';
              return `<li><div>${img}<span class="title">${MPS.escapeHtml(name)}</span><div class="qty">資料日：${MPS.escapeHtml(r.date || '—')}</div></div><span class="badge muted">詳情二期</span></li>`;
            }).join('') + '</ul>';
        } catch (e) {
          document.getElementById('extra').innerHTML = '<p class="empty">未能載入分類鏡像</p>';
        }
      }
      if (location.pathname.endsWith('rank.html') || location.pathname.endsWith('diff.html')) {
        document.getElementById('extra').innerHTML = '<p><span class="badge">暫不可用</span></p>';
      }
    });
  </script>
</body>
</html>
