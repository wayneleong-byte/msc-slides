<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>第十一屆我最愛餐廳選舉｜澳門美食地圖</title>
  <meta name="description" content="食客向互動地圖：第十一屆我最愛餐廳選舉獲獎餐廳，可按分類篩選，並以高德地圖導航。" />
  <link rel="stylesheet" href="assets/leaflet/leaflet.css" />
  <link rel="stylesheet" href="assets/app.css?v=5" />
</head>
<body class="view-map">
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <h1>澳門美食地圖</h1>
        <p class="sub">第十一屆我最愛餐廳選舉 · 食客向</p>
      </div>
      <div class="topbar-actions">
        <div class="mode-switch" role="tablist" aria-label="觀看模式">
          <button type="button" id="btnModeMap" class="on" role="tab" aria-selected="true">地圖</button>
          <button type="button" id="btnModeList" role="tab" aria-selected="false">列表</button>
        </div>
        <button type="button" id="btnTogglePanel" class="icon-btn" aria-label="開啟／關閉列表">☰</button>
      </div>
    </header>

    <div class="workspace">
      <aside id="panel" class="panel">
        <div class="panel-inner">
          <div class="search-row">
            <input id="search" type="search" placeholder="搜尋店名、獎項、地址…" autocomplete="off" enterkeyhint="search" />
            <button type="button" id="btnClear" class="text-btn">清除</button>
          </div>

          <div class="filter-block">
            <div class="filter-label">獎項類型</div>
            <div id="groupFilters" class="chips"></div>
          </div>

          <div class="filter-block collapsible">
            <button type="button" class="filter-label toggle" id="btnToggleCats">分類（25類等） ▾</button>
            <div id="catFilters" class="chips cats hidden"></div>
          </div>

          <div class="result-meta">
            <span id="resultCount">—</span>
            <span id="pinHint" class="muted"></span>
          </div>

          <ul id="list" class="list"></ul>

          <footer class="panel-foot">
            <details class="src-details">
              <summary>資料說明</summary>
              <p>資料來源：第十一屆我最愛餐廳選舉獲獎名單（澳門餐飲行業協會／劃澳等主辦承辦）。位置與聯絡優先引用<a href="https://www.macaotourism.gov.mo/" target="_blank" rel="noopener">澳門旅遊局</a>公開餐飲資料及餐廳／酒店官方頁。缺漏欄位不捏造。</p>
              <p class="muted">底圖 OpenStreetMap；導航使用高德地圖深連結（未載入高德 JS API）。</p>
            </details>
          </footer>
        </div>
      </aside>

      <div class="map-pane">
        <div id="soloBanner" class="solo-banner hidden" role="status">
          <span id="soloText" class="solo-text">只顯示一間餐廳</span>
          <button type="button" id="btnClearSolo">顯示全部</button>
        </div>
        <main id="map" role="application" aria-label="澳門餐廳地圖"></main>
        <div id="detail" class="detail hidden" aria-live="polite">
          <button type="button" id="btnCloseDetail" class="detail-close" aria-label="關閉">×</button>
          <div id="detailBody"></div>
        </div>
      </div>
    </div>

    <nav class="bottom-nav" aria-label="手機觀看模式">
      <button type="button" id="navMap" class="on" aria-current="page">
        <span class="ico">🗺️</span>
        <span>地圖</span>
      </button>
      <button type="button" id="navList">
        <span class="ico">📋</span>
        <span>列表篩選</span>
      </button>
    </nav>
  </div>

  <script src="assets/leaflet/leaflet.js"></script>
  <script src="assets/app.js?v=5"></script>
</body>
</html>
